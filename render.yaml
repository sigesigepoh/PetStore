services:
  # 1. Back-end Service (Spring Boot API)
  - type: web
    name: petstore-api
    runtime: docker
    repo: https://github.com/sigesigepoh/PetStore
    plan: free
    rootDir: backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: petstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: petstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: petstore-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: petstore-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password

  # 2. Front-end Service (React Static Site)
  - type: web
    name: petstore-web
    runtime: static
    repo: https://github.com/sigesigepoh/PetStore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: petstore-db
    plan: free