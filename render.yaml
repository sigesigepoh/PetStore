services:
  # 1. Back-end Service (Spring Boot)
  - type: web
    name: petstore-api
    runtime: docker # Highly recommended for Spring Boot projects
    repo: https://github.com/sigesigepoh/PetStore # Update this link
    plan: free
    rootDir: backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${PETSTORE_DB_HOST}:${PETSTORE_DB_PORT}/${PETSTORE_DB_DATABASE}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: petstore-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password

  # 2. Front-end Service (React Static Site)
  - type: web
    name: petstore-web
    runtime: static
    repo: https://github.com/sigesigepoh/PetStore # Update this link
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Managed PostgreSQL Database
databases:
  - name: petstore-db
    plan: free
